services:
  # ---------------------------------------------------
  # 🚪 API Gateway — Hot reload
  # ---------------------------------------------------
  gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: ../../container/dockerfiles/dev/gateway.dev.Dockerfile
    container_name: gateway_dev
    ports:
      - "8000:8000"     # public gateway
    volumes:
      - ../../backend/api-gateway:/app
      - gateway_node:/app/node_modules
    env_file:
      - ../../backend/api-gateway/.env
    depends_on:
      - auth-service
      - quiz-service
      - result-service
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.25
          memory: 128M
    networks:
      - quiz-net

  # ---------------------------------------------------
  # 🔐 Auth Service — Node + Hot reload
  # ---------------------------------------------------
  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: ../../container/dockerfiles/dev/auth.dev.Dockerfile
    container_name: auth_service_dev
    expose:
      - "5000"          # chỉ lắng nghe trong mạng trong docker, KHÔNG public
    volumes:
      - ../../backend/auth-service:/app
      - auth_node:/app/node_modules
    env_file:
      - ../../backend/auth-service/.env
    depends_on:
      mysql-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 128M
        reservations:
          cpus: 0.25
          memory: 64M
    networks:
      - quiz-net

  # ---------------------------------------------------
  # 🧠 Quiz Service — Node + Hot reload
  # ---------------------------------------------------
  quiz-service:
    build:
      context: ../../backend/quiz-service
      dockerfile: ../../container/dockerfiles/dev/quiz.dev.Dockerfile
    container_name: quiz_service_dev
    expose:
      - "5001"
    volumes:
      - ../../backend/quiz-service:/app
      - quiz_node:/app/node_modules
    env_file:
      - ../../backend/quiz-service/.env
    depends_on:
      mysql-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.25
          memory: 128M
    networks:
      - quiz-net

  # ---------------------------------------------------
  # 📊 Result Service — Node + Hot reload
  # ---------------------------------------------------
  result-service:
    build:
      context: ../../backend/result-service
      dockerfile: ../../container/dockerfiles/dev/result.dev.Dockerfile
    container_name: result_service_dev
    expose:
      - "5002"
    volumes:
      - ../../backend/result-service:/app
      - result_node:/app/node_modules
    env_file:
      - ../../backend/result-service/.env
    depends_on:
      mysql-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.25
          memory: 128M
    networks:
      - quiz-net

  # ---------------------------------------------------
  # 🛢️ MySQL – DEV mode
  # ---------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"          
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          cpus: 0.5
          memory: 128M
    networks:
      - quiz-net

  # ---------------------------------------------------
  # 🧭 phpMyAdmin — optional dev tool
  # ---------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: phpmyadmin_dev
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql-db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64M
        reservations:
          cpus: 0.25
          memory: 32M
    networks:
      - quiz-net

  # ---------------------------------------------------
  # 🌐 Frontend Old — Dev (React Hot reload)
  # ---------------------------------------------------
  frontend-old:
    build:
      context: ../../archive/frontendOld
      dockerfile: Dockerfile.dev
    container_name: frontend_old_dev
    ports:
      - "5173:5173"   
    volumes:
      - ../../archive/frontendOld:/app
      - /app/node_modules
    env_file:
      - ../../archive/frontendOld/.env
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 256M
    networks:
      - quiz-net
    
  # ---------------------------------------------------
  # ⚡ Redis — Cache / Queue / Session
  # ---------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis_dev
    ports:
      - "6379:6379"  
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_dev:/data
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
        reservations:
          cpus: 0.1
          memory: 64M
    networks:
      - quiz-net

# ---------------------------------------------------
# 🌐 Networks & Volumes
# ---------------------------------------------------
networks:
  quiz-net:
    name: quiz-net

volumes:
  gateway_node:
  auth_node:
  quiz_node:
  result_node:
  mysql_data_dev:
  redis_data_dev: