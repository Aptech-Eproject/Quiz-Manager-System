services:
  gateway:
    volumes:
      - ./gateway/:/app
      - /app/node_modules
    command: npm run dev

  auth-service:
    volumes:
      - ./services/auth-service/:/app
      - /app/node_modules
    command: npm run dev

  quiz-service:
    volumes:
      - ./services/quiz-service/:/app
      - /app/node_modules
    command: npm run dev

  result-service:
    volumes:
      - ./services/result-service/:/app
      - /app/node_modules
    command: npm run dev
  frontend-old:
      build: 
        context: ./frontendOld
        dockerfile: Dockerfile.dev
      ports:
        - "5173:5173"
      volumes:
        - ./frontendOld:/app
        - /app/node_modules
      command: ["npm", "run", "dev", "--", "--host"]
      networks:
        - quiz-net
      env_file:
        - ./frontendOld/.env