name: CD - Main Branch (Production)

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Production Ready
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env files
        run: |
          cp container/env/gateway.env.example backend/api-gateway/.env
          cp container/env/auth.env.example backend/auth-service/.env
          cp container/env/quiz.env.example backend/quiz-service/.env
          cp container/env/result.env.example backend/result-service/.env

      - name: Remove dev override for production
        run: rm -f docker-compose.override.yml

      - name: Validate docker-compose
        run: docker compose -f container/compose/docker-compose.prod.yml config --quiet

      - name: Check required files
        run: |
          test -f container/compose/docker-compose.prod.yml || exit 1
          test -f container/scripts/init-db.sql || exit 1
          test -f container/dockerfiles/production/auth.prod.Dockerfile || exit 1
          test -f container/dockerfiles/production/quiz.prod.Dockerfile || exit 1
          test -f container/dockerfiles/production/result.prod.Dockerfile || exit 1
          test -f container/dockerfiles/production/gateway.prod.Dockerfile || exit 1
          echo "✅ All required files present"

