name: CI - Working Branches

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dev'
  pull_request:
    branches:
      - dev

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/api-gateway/package-lock.json
            backend/*/package-lock.json
          

      - name: Install Gateway dependencies
        run: cd backend/api-gateway && npm ci

      - name: Install Auth Service dependencies
        run: cd backend/auth-service && npm ci

      - name: Install Quiz Service dependencies
        run: cd backend/quiz-service && npm ci

      - name: Install Result Service dependencies
        run: cd backend/result-service && npm ci

      # - name: Install Frontend dependencies
      #   run: cd frontend && npm ci

      - name: Lint Gateway
        run: cd backend/api-gateway && npm run lint || echo "No lint script"

      - name: Lint Services
        run: |
          cd backend/auth-service && npm run lint || echo "No lint script"
          cd ../quiz-service && npm run lint || echo "No lint script"
          cd ../result-service && npm run lint || echo "No lint script"

      # - name: Lint Frontend
      #   run: cd frontend && npm run lint || echo "No lint script"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Gateway
        run: docker build -f container/dockerfiles/dev/gateway.dev.Dockerfile -t gateway:test ./backend/api-gateway

      - name: Build Auth Service
        run: docker build -f container/dockerfiles/dev/auth.dev.Dockerfile -t auth-service:test ./backend/auth-service

      - name: Build Quiz Service
        run: docker build -f container/dockerfiles/dev/quiz.dev.Dockerfile -t quiz-service:test ./backend/quiz-service

      - name: Build Result Service
        run: docker build -f container/dockerfiles/dev/result.dev.Dockerfile -t result-service:test ./backend/result-service

      # - name: Build Frontend
      #   run: docker build -t frontend:test ./frontend
