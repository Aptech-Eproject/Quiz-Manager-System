<svg width="660" height="180" viewBox="0 0 660 180" role="img" aria-label="Token flow animation" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="token-flow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#00BFA5"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#888" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="30" y="40" width="120" height="60" rx="14" fill="rgba(108,99,255,0.15)" stroke="#6C63FF"/>
    <rect x="200" y="40" width="120" height="60" rx="14" fill="rgba(0,191,165,0.15)" stroke="#00BFA5"/>
    <rect x="370" y="40" width="120" height="60" rx="14" fill="rgba(255,138,101,0.15)" stroke="#FF8A65"/>
    <rect x="540" y="40" width="120" height="60" rx="14" fill="rgba(48,79,254,0.15)" stroke="#304FFE"/>
  </g>
  <text x="90" y="75" text-anchor="middle" fill="#6C63FF" font-weight="bold">Frontend</text>
  <text x="260" y="75" text-anchor="middle" fill="#00BFA5" font-weight="bold">Gateway</text>
  <text x="430" y="75" text-anchor="middle" fill="#FF8A65" font-weight="bold">Auth Service</text>
  <text x="600" y="75" text-anchor="middle" fill="#304FFE" font-weight="bold">MySQL</text>

  <!-- access token animation -->
  <path d="M 90 120 C 160 150 230 150 300 120" stroke="#6C63FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle r="6" fill="#6C63FF" cx="90" cy="120">
    <animate attributeName="cx" values="90;160;230;300;90" keyTimes="0;0.33;0.66;0.99;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;150;150;120;120" keyTimes="0;0.33;0.66;0.99;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="150" text-anchor="middle" fill="#6C63FF" font-size="11">Access Token → Authorization header</text>

  <!-- refresh token animation -->
  <path d="M 430 120 C 500 150 570 150 640 120" stroke="#FF8A65" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle r="6" fill="#FF8A65" cx="430" cy="120">
    <animate attributeName="cx" values="430;500;570;640;430" keyTimes="0;0.33;0.66;0.99;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;150;150;120;120" keyTimes="0;0.33;0.66;0.99;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="540" y="150" text-anchor="middle" fill="#FF8A65" font-size="11">Refresh Token → DB storage</text>

  <!-- request path -->
  <path d="M 90 110 L 260 110 L 430 110 L 90 110" fill="none" stroke="url(#token-flow-gradient)" stroke-width="4" stroke-linecap="round"/>
  <circle r="8" fill="#fff" stroke="url(#token-flow-gradient)" stroke-width="3" cx="90" cy="110">
    <animate attributeName="cx" values="90;260;430;90" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="250" y="100" fill="#00BFA5" font-size="11">401? → Refresh</text>
</svg>
